spring:
  # 配置数据源
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://YOUR_MYSQL_HOST:3306/vibe_music?useUnicode=true&characterEncoding=utf-8&useSSL=false # 修改你的 MySQL 地址和库名
    username: YOUR_MYSQL_USER # 修改你的 MySQL 用户名
    password: YOUR_MYSQL_PASSWORD # 修改你的 MySQL 密码
    type: com.alibaba.druid.pool.DruidDataSource # 配置连接池

  # Redis 服务连接配置
  data:
    redis:
      database: 1
      host: 127.0.0.1
      port: 6379
      password:

  # 邮件配置（EmailServiceImpl 通过 @Value("${spring.mail.username}") 强依赖此项；
  # 本地无真实 SMTP 时填占位值即可启动，仅“发送验证码”功能不可用）
  mail:
    host: smtp.example.com
    port: 465
    username: no-reply@example.com
    password: placeholder
    protocol: smtps
    properties:
      mail:
        smtp:
          ssl:
            enable: true
          auth: true
          starttls:
            enable: false

  servlet:
    multipart:
      max-file-size: 100MB # 设置最大上传文件大小为 100MB
      max-request-size: 100MB # 设置最大请求大小为 100MB

  # 对于注解的 Redis 缓存数据统一设置有效期为 10 分钟，单位毫秒
  cache:
    redis:
      time-to-live: 600000

# 配置 mybatis-plus
mybatis-plus:
  type-aliases-package: cn.edu.seig.vibemusic.model.entity # 实体类所在的包（修正原错误包路径 cn.edu.seig.pojo）

  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 配置日志
    map-underscore-to-camel-case: true # 类属性与表字段的驼峰映射

  global-config:
    db-config: # 数据库配置
      table-prefix: tb_  # 表名前缀为tb_，表名为前缀连接类名（小写）

# 定义角色和路径权限的映射关系
role-path-permissions:
  permissions:
    ROLE_ADMIN:
      - "/admin/"
    ROLE_USER:
      - "/user/"
      - "/playlist/"
      - "/artist/"
      - "/song/"
      - "/favorite/"
      - "/comment/"
      - "/banner/"
      - "/feedback/"

minio:
  endpoint: http://YOUR_MINIO_HOST:9000 # 修改你的 MinIO 端点
  accessKey: YOUR_MINIO_ACCESS_KEY # 修改你的 MinIO Access Key
  secretKey: YOUR_MINIO_SECRET_KEY # 修改你的 MinIO Secret Key
  bucket: vibe-music-data # 确认 Bucket 名称与你创建的一致
